<dialog id="ledger-dialog" aria-labelledby="ledger-heading"><div class="dialog-head"><h2 id="ledger-heading">旅行记账</h2><button data-close>关闭 ×</button></div><p class="small">日元记账；可选择参与者均分。已记账目的参与成员保持不变，后来新增成员不会自动分摊旧账。</p><div id="ledger-totals"></div><form id="member-form" class="inline-form"><label>新成员<input name="member" required maxlength="24" placeholder="姓名或昵称"></label><button type="submit">添加成员</button></form><div id="members-list"></div><form id="expense-form"><div class="form-grid"><label>项目<input name="title" required maxlength="80" placeholder="如：浅草午餐"></label><label>金额（日元）<input name="amount" type="number" required min="1" max="99999999" step="1"></label><label>付款人<select name="payer" id="payer-select"></select></label><label>类别<select name="category"><option>餐饮</option><option>购物</option><option>交通</option><option>住宿</option><option>体验</option><option>其他</option></select></label></div><fieldset><legend>分摊成员</legend><div id="split-members"></div></fieldset><button class="primary" type="submit">记一笔</button><p id="expense-message" role="status"></p></form><div id="expense-list"></div><div id="settlement"></div><button id="undo-expense" hidden>撤销删除</button></dialog>
